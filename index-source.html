<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#192b35"><meta name="description" content="Build a bridge to the lighthouse.">
<title>CLOUDSPAN</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css">
</head><body><main class="game">
<header><span class="brand">◈ &nbsp; CLOUDSPAN</span><button id="menuOpen" class="icon" aria-label="Open menu">☰</button></header>
<div class="intro"><div class="name"><span id="number"></span><h1 id="title"></h1></div><b id="wood" class="stock"></b></div>
<section id="board" aria-label="Floating islands">
<canvas id="view" aria-hidden="true"></canvas><div id="targets"></div>
</section>
<footer><p id="hint" aria-live="polite"></p><button id="undo" class="icon" aria-label="Undo bridge" hidden>↶</button><button id="receipt" class="primary" hidden>Result</button></footer>
</main>
<dialog id="menu" aria-labelledby="menuTitle">
<div class="dialogHead"><h2 id="menuTitle">Islands</h2><button id="closeMenu" class="icon" aria-label="Close menu">×</button></div>
<div class="tools"><button id="restart">Restart</button><button id="sound" aria-pressed="true">Sound on</button></div>
<p id="par"></p><div id="routes"></div><div class="palette" id="palette"></div><p id="perks" hidden></p>
</dialog>
<dialog id="result" aria-labelledby="resultTitle">
<div class="dialogHead"><h2 id="resultTitle">Lighthouse lit</h2><button id="closeResult" class="icon" aria-label="Close result">×</button></div>
<p id="stars" class="stars"></p><p id="score"></p><button id="next" class="primary">Next →</button>
</dialog>
<script type="module" src="app.mjs"></script></body></html>
